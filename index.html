<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Smart Shop Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app with a bottom tab bar (ড্যাশবোর্ড, বিক্রি, পণ্য, লেনদেন, আরও).
   Visual idea: a shop's stock register. Deep register-green for brand, orange only for warnings, red only for money owed. */
:root {
  --bg: #F1F4F2;
  --surface: #FFFFFF;
  --ink: #14231E;
  --muted: #586A63;
  --line: #DAE3DE;
  --brand: #0E5A48;
  --on-brand: #F1FBF7;
  --brand-soft: #DDF0E8;
  --warn: #B3470F;
  --warn-bg: #FCE9DC;
  --bad: #B3261E;
  --bad-bg: #FBE6E4;
  --good: #17784F;
  --good-bg: #E1F3EA;
  --focus: #1D5FA8;
  --font-display: 'Anek Bangla', 'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif;
  --font-body: 'Hind Siliguri', 'Noto Sans Bengali', 'Kalpurush', system-ui, sans-serif;
  --fs-xs: 0.75rem; --fs-sm: 0.875rem; --fs-base: 1rem; --fs-lg: 1.25rem; --fs-xl: 1.625rem; --fs-2xl: 2.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1411; --surface: #141F1B; --ink: #E7F0EB; --muted: #96A9A1; --line: #24342E;
    --brand: #2FA583; --on-brand: #04140E; --brand-soft: #173128;
    --warn: #F2A06B; --warn-bg: #3A2517; --bad: #FF8A82; --bad-bg: #3A1C1B;
    --good: #58D39B; --good-bg: #16322A; --focus: #7DB6F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1411; --surface: #141F1B; --ink: #E7F0EB; --muted: #96A9A1; --line: #24342E;
  --brand: #2FA583; --on-brand: #04140E; --brand-soft: #173128;
  --warn: #F2A06B; --warn-bg: #3A2517; --bad: #FF8A82; --bad-bg: #3A1C1B;
  --good: #58D39B; --good-bg: #16322A; --focus: #7DB6F0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: var(--fs-base); line-height: 1.55;
  padding-block: 12px 108px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums;
}
h1, h2, h3, p, ul { margin: 0; } ul { padding: 0; list-style: none; }
h2 { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 800; line-height: 1.3; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: var(--fs-base); font-weight: 700; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.note { font-size: var(--fs-sm); color: var(--muted); }
.wrap { max-width: 600px; margin: 0 auto; display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.ok { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }

/* headers */
.top { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.logo { width: 44px; height: 44px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: var(--fs-lg); overflow: hidden; flex: none; }
.logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.top .t { min-width: 0; flex: 1; display: grid; }
.top .t b { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.top .t small { color: var(--muted); font-size: var(--fs-sm); }
.sub-top { display: flex; align-items: center; gap: 4px; min-height: 48px; }
.sub-top h1 { font-family: var(--font-display); font-size: var(--fs-lg); font-weight: 800; flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.back { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; border-radius: 10px; flex: none; margin-left: -10px; }
.back svg, .navbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* controls */
.field { min-width: 0; display: grid; gap: 4px; }
.field label { font-size: var(--fs-sm); color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.0625rem; font-weight: 500;
}
.field textarea { height: auto; padding: 10px 12px; font-size: 0.9375rem; line-height: 1.5; resize: vertical; }
.field input[type="date"] { font-size: 1rem; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.btn { min-height: 48px; border: 0; border-radius: 10px; background: var(--brand); color: var(--on-brand); font-size: var(--fs-base); font-weight: 700; cursor: pointer; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.dark { background: var(--ink); color: var(--bg); }
.btn.danger { color: var(--bad); }
.btn.small { min-height: 40px; padding: 0 12px; font-size: var(--fs-sm); }
.btnrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; color: var(--muted); height: 40px; border-radius: 8px; font-size: 0.9375rem; font-weight: 600; cursor: pointer; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); height: 36px; padding: 0 14px; border-radius: 999px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag { display: inline-block; font-size: 0.6875rem; font-weight: 700; padding: 0 7px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.tag.low { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.due { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.err { color: var(--bad); font-weight: 600; font-size: var(--fs-sm); }
.banner { background: var(--surface); border: 1px dashed var(--muted); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; font-size: var(--fs-sm); }
.banner.warnb { border: 1px solid transparent; background: var(--warn-bg); color: var(--warn); border-style: solid; }

/* KPIs */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; text-align: left; color: var(--ink); display: grid; align-content: start; gap: 0; }
button.kpi { cursor: pointer; }
.kpi .l { font-size: var(--fs-xs); color: var(--muted); }
.kpi .v { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.kpi .s { font-size: var(--fs-xs); color: var(--muted); }
.kpi.hero { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.kpi.hero .l, .kpi.hero .s { color: var(--on-brand); opacity: 0.85; }

/* lists */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.list-h { padding: 12px 14px; font-family: var(--font-display); font-weight: 700; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.row { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; min-height: 56px; }
button.row { cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row .m { min-width: 0; display: grid; }
.row .m b { font-weight: 600; overflow-wrap: anywhere; }
.row .m small { color: var(--muted); font-size: var(--fs-xs); overflow-wrap: anywhere; }
.row .r { text-align: right; font-family: var(--font-display); font-weight: 800; }
.row .r small { display: block; font-family: var(--font-body); font-weight: 500; font-size: var(--fs-xs); color: var(--muted); }
.row.void .m b, .row.void .r { text-decoration: line-through; color: var(--muted); }
.empty { padding: 24px 16px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.strip { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* charts */
.bars { display: flex; align-items: flex-end; gap: 6px; height: 170px; }
.bcol { flex: 1; min-width: 0; height: 100%; display: grid; grid-template-rows: 1fr auto auto; justify-items: center; gap: 3px; }
.bcol .bar { align-self: end; width: 72%; max-width: 40px; min-height: 2px; background: var(--brand); border-radius: 4px 4px 0 0; }
.bcol.hi .bar { background: var(--warn); }
.bcol .bv { font-size: 0.6875rem; font-weight: 700; white-space: nowrap; }
.bcol .bl { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--muted); font-weight: 600; font-size: var(--fs-xs); }

/* health */
.ring { position: relative; width: 132px; height: 132px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .n { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-family: var(--font-display); font-weight: 800; font-size: 2.25rem; line-height: 1; }
.ring .n small { font-family: var(--font-body); font-weight: 500; font-size: var(--fs-xs); color: var(--muted); }
.healthtop { display: flex; gap: 16px; align-items: center; }
.meter { height: 8px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--brand); }
.part { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.part:last-child { border-bottom: 0; }
.part .h { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }

/* cart */
.item { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .h { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.item .h b { font-weight: 600; overflow-wrap: anywhere; }
.item .ctl { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.stepper { display: grid; grid-template-columns: 44px 64px 44px; gap: 4px; }
.stepper button { height: 44px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; font-size: 1.25rem; cursor: pointer; }
.stepper input { height: 44px; min-width: 0; width: 100%; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 1rem; font-family: var(--font-body); }
.x { border: 0; background: transparent; color: var(--muted); font-size: var(--fs-sm); text-decoration: underline; cursor: pointer; min-height: 36px; padding: 0 4px; }
.sumrow { display: flex; justify-content: space-between; gap: 12px; }
.sumrow.big { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-lg); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 12px; text-align: left; cursor: pointer; min-height: 48px; display: grid; }
.pick button small { color: var(--muted); font-size: var(--fs-xs); }

/* tab bar and sheets */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar-in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.navbtn { position: relative; border: 0; background: transparent; color: var(--muted); display: grid; justify-items: center; gap: 1px; padding: 6px 0; border-radius: 10px; cursor: pointer; font-size: 0.6875rem; font-weight: 600; font-family: var(--font-body); }
.navbtn[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }
.navbtn .bd { position: absolute; top: 2px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn); color: var(--bg); font-size: 0.6875rem; line-height: 18px; text-align: center; font-weight: 700; }
.fab { position: fixed; z-index: 19; height: 52px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: var(--fs-base); font-weight: 700; cursor: pointer;
  right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 6px 18px rgba(0,0,0,0.28); }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(5, 10, 8, 0.55); }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; background: var(--surface); color: var(--ink); border-radius: 16px 16px 0 0; border: 1px solid var(--line);
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-height: 92%; overflow-y: auto; }
.sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: var(--fs-sm); font-weight: 600; max-width: calc(100% - 32px); }
.loading { padding: 40px 0; text-align: center; color: var(--muted); }
.logoprev { display: flex; align-items: center; gap: 12px; }
.pre { font-family: ui-monospace, Menlo, Consolas, monospace !important; font-size: 0.75rem !important; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">খাতা খোলা হচ্ছে…</div></div>
<nav class="tabbar" id="nav" aria-label="প্রধান মেনু" hidden></nav>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  'use strict';

  /*CALC-START*/
  var BN = '০১২৩৪৫৬৭৮৯';
  var MONTHS = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
  var MSHORT = ['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে'];
  function toBn(s) { return String(s).replace(/\d/g, function (d) { return BN[+d]; }); }
  function round2(n) { return Math.round(n * 100) / 100; }
  function fmt(n, dec) {
    dec = dec || 0;
    return toBn(Number(n).toLocaleString('en-IN', { minimumFractionDigits: dec, maximumFractionDigits: dec }));
  }
  function num(n) { n = round2(n); return fmt(n, Number.isInteger(n) ? 0 : 2); }
  function money(n) { return (n < 0 ? '−' : '') + '৳' + num(Math.abs(n)); }
  function compact(n) { return n >= 10000 ? fmt(n / 1000, 1) + 'হা' : fmt(Math.round(n)); }
  function parseNum(s) {
    if (s == null) return NaN;
    var t = String(s).replace(/[০-৯]/g, function (d) { return BN.indexOf(d); }).replace(/[,\s৳]/g, '').replace('।', '.');
    if (t === '') return NaN;
    var v = Number(t);
    return isFinite(v) ? v : NaN;
  }
  function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function parseISO(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function addDays(iso, n) { var d = parseISO(iso); d.setDate(d.getDate() + n); return isoDate(d); }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }
  function dateTxt(iso) {
    var d = parseISO(iso); if (!d) return '';
    var s = toBn(d.getDate()) + ' ' + MONTHS[d.getMonth()];
    return d.getFullYear() === new Date().getFullYear() ? s : s + ' ' + toBn(d.getFullYear());
  }
  function sumBy(arr, fn) { var t = 0; arr.forEach(function (x) { t += fn(x); }); return round2(t); }

  function liveSales(d) { return d.sales.filter(function (s) { return !s.void; }); }
  function livePurch(d) { return d.purchases.filter(function (s) { return !s.void; }); }
  function saleProfit(s) { var p = -(s.disc || 0); s.items.forEach(function (i) { p += (i.price - i.cost) * i.qty; }); return round2(p); }
  function isLow(p) { return p.stock <= (p.min || 0); }

  /* Customer due and supplier payable, in one pass. */
  function balances(d) {
    var c = {}, s = {};
    liveSales(d).forEach(function (x) { if (x.party) c[x.party] = round2((c[x.party] || 0) + x.total - x.paid); });
    livePurch(d).forEach(function (x) { if (x.party) s[x.party] = round2((s[x.party] || 0) + x.total - x.paid); });
    d.payments.forEach(function (p) {
      if (p.kind === 'cust') c[p.party] = round2((c[p.party] || 0) - p.amt);
      else s[p.party] = round2((s[p.party] || 0) - p.amt);
    });
    return { c: c, s: s };
  }
  function totalPositive(map) { var t = 0; Object.keys(map).forEach(function (k) { if (map[k] > 0) t += map[k]; }); return round2(t); }

  function rangeStats(d, from, to) {
    var ss = liveSales(d).filter(function (x) { return x.date >= from && x.date <= to; });
    var sales = sumBy(ss, function (x) { return x.total; });
    var profit = sumBy(ss, saleProfit);
    var exp = sumBy(d.expenses.filter(function (x) { return x.date >= from && x.date <= to; }), function (x) { return x.amt; });
    return { sales: sales, profit: profit, exp: exp, net: round2(profit - exp), count: ss.length };
  }
  function bucketStats(d, kind, today) {
    var out = [], i, to, from, y, m, dt;
    if (kind === 'day') {
      for (i = 13; i >= 0; i--) { to = addDays(today, -i); out.push({ label: toBn(parseISO(to).getDate()), from: to, to: to }); }
    } else if (kind === 'week') {
      for (i = 7; i >= 0; i--) { to = addDays(today, -7 * i); from = addDays(to, -6); dt = parseISO(from); out.push({ label: toBn(dt.getDate()) + ' ' + MSHORT[dt.getMonth()], from: from, to: to }); }
    } else {
      dt = parseISO(today);
      for (i = 5; i >= 0; i--) {
        y = dt.getFullYear(); m = dt.getMonth() - i;
        var f = new Date(y, m, 1), l = new Date(y, m + 1, 0);
        out.push({ label: MSHORT[f.getMonth()], from: isoDate(f), to: isoDate(l) });
      }
    }
    return out.map(function (b) { return { label: b.label, from: b.from, to: b.to, s: rangeStats(d, b.from, b.to) }; });
  }

  /* One pass over sales: last sale date and units sold in a window, per product. */
  function salesIndex(d, fromDate) {
    var idx = {};
    liveSales(d).forEach(function (s) {
      s.items.forEach(function (it) {
        var e = idx[it.pid] || (idx[it.pid] = { last: '', units: 0, revenue: 0, profit: 0 });
        if (s.date > e.last) e.last = s.date;

    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = 128, c = document.createElement('canvas'); c.width = s; c.height = s;
        var x = c.getContext('2d'), m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
        x.drawImage(img, sx, sy, m, m, 0, 0, s, s);
        try { cb(c.toDataURL('image/jpeg', 0.82)); } catch (e) { cb(''); }
      };
      img.onerror = function () { cb(''); };
      img.src = rd.result;
    };
    rd.onerror = function () { cb(''); };
    rd.readAsDataURL(file);
  }

          newShop('আমার দোকান', false); ui.view = 'shop'; ui.hist = [{ view: 'home', p: {} }]; render(); toast('এবার দোকানের নাম বসান');
        }); break;
      case 'copy-backup': copyText($('#bk').value, $('#bk')); break;
      case 'restore': {
        var raw = $('#rs').value.trim(), er2 = $('#rsErr'), parsed = null;
        try { parsed = JSON.parse(raw); } catch (x) { parsed = null; }
        if (!parsed || !parsed.meta || !Array.isArray(parsed.meta.shops) || !parsed.meta.shops.length || !parsed.data) { er2.textContent = 'ব্যাকআপের লেখাটি ঠিক নেই। পুরো লেখা কপি করে পেস্ট করুন।'; er2.hidden = false; return; }
        er2.hidden = true;
        confirmTwice(b, 'rs', 'ফিরিয়ে আনুন', function () {
          Object.keys(ALL).forEach(function (k) { kv.del('data:' + k); });
          ALL = {}; meta = { shops: [], active: '' };
          parsed.meta.shops.forEach(function (s) { if (s && s.id && parsed.data[s.id]) { meta.shops.push({ id: String(s.id), name: String(s.name || 'দোকান'), addr: s.addr || '', phone: s.phone || '', logo: typeof s.logo === 'string' ? s.logo : '', sample: !!s.sample }); ALL[s.id] = ensureData(parsed.data[s.id]); dirty[s.id] = true; } });
          if (!meta.shops.length) { newShop('আমার দোকান', false); }
          meta.active = ALL[parsed.meta.active] ? parsed.meta.active : meta.shops[0].id; D = ALL[meta.active]; save(); flush(); ui.hist = []; ui.view = 'home'; render(); toast('ব্যাকআপ থেকে ফিরে এসেছে');
        }); break;
      }
    }
  });

  /* ================= boot ================= */
  function boot() {
    kv.open().then(function () { return kv.get('meta'); }).then(function (m) {
      if (m && Array.isArray(m.shops) && m.shops.length) {
        meta = m;
        return Promise.all(m.shops.map(function (s) { return kv.get('data:' + s.id).then(function (d) { ALL[s.id] = ensureData(d); }); }));
      }
      meta = { shops: [], active: '' };
      newShop('নমুনা দোকান', true);
      meta.shops[0].sample = true;
      return null;
    }).then(function () {
      if (!ALL[meta.active]) meta.active = meta.shops[0].id;
      D = ALL[meta.active]; ui.deadDays = D.settings.dead || 30;
      flush(); render();
    });
  }
  boot();
})();
</script>
</body>
</html>
